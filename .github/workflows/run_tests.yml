name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    # These names are required checks in GitHub branch protection.
    name: build (${{ matrix.os }}, ${{ matrix.label || matrix.environment }})
    strategy:
      max-parallel: 7
      matrix:
        include:
          - os: ubuntu-latest
            environment: ci
            label: default
          - os: ubuntu-latest
            environment: py312
          - os: ubuntu-latest
            environment: py313
          - os: ubuntu-latest
            environment: py314
          - os: windows-latest
            environment: test
            label: default
          - os: macos-latest
            environment: test
            label: default
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        sparse-checkout-cone-mode: false
        sparse-checkout: |
          /*
          !/data/examples/
    - name: Setup pixi
      uses: prefix-dev/setup-pixi@v0.11.2
      with:
        cache: true
        environments: ${{ matrix.environment }}
    - name: Lint
      if: ${{ matrix.environment == 'ci' }}
      run: pixi run -e "${{ matrix.environment }}" lint-gh-actions
    - name: Type check
      if: ${{ matrix.environment == 'ci' }}
      run: pixi run -e "${{ matrix.environment }}" type-check
    - name: Install Chromium headless shell for Playwright tests
      if: runner.os != 'Windows'
      run: pixi run -e "${{ matrix.environment }}" playwright install chromium --with-deps --only-shell
    - name: Test with pytest
      # The Windows runner includes Chrome for the Playwright smoke test.
      run: pixi run -e "${{ matrix.environment }}" test --durations=10 ${{ runner.os == 'Windows' && '--browser-channel chrome' || '' }}
    - name: Upload coverage to Codecov
      if: ${{ !cancelled() }}
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        flags: ${{ matrix.os }}-${{ matrix.label || matrix.environment }}
    - name: Upload test results to Codecov
      if: ${{ !cancelled() }}
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        flags: ${{ matrix.os }}-${{ matrix.label || matrix.environment }}
        report_type: test_results
